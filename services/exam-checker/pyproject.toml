[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pi-exam-checker-service"
version = "0.1.0"
description = "Document parsing and exam normalization service for Pi Agent"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pypdf==6.10.0",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.1.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
]

[project.scripts]
exam-checker-service = "exam_checker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exam_checker"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "exam_checker/assets/prompts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
